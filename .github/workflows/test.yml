name: ERP CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Python tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Force LF line endings
        run: find . -type f \( -name "*.py" -o -name "*.md" -o -name "*.yml" -o -name "*.txt" \) -exec sed -i 's/\r$//' {} \;

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          cd ${{ github.workspace }}
          pytest -v --maxfail=1 --tb=short

      - name: Smoke test: app starts and /api/health returns 200
        run: |
          cd ${{ github.workspace }}
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          r = client.get('/api/health')
          assert r.status_code == 200
          assert r.json()['status'] == 'ok'
          print('Health check PASS')
          "

      - name: Verify all 8 user stories have tests
        run: |
          cd ${{ github.workspace }}
          python -c "
          import re
          with open('tests/test_api.py') as f:
              content = f.read()
          tests = re.findall(r'def test_(\w+)\(', content)
          print(f'Found {len(tests)} tests')
          required = ['health', 'list_products_empty', 'create_product', 'get_product_by_id',
                      'update_stock', 'create_order_decrements_stock', 'create_order_insufficient_stock',
                      'list_orders', 'low_stock', 'create_product_duplicate_sku',
                      'get_product_not_found', 'create_order_product_not_found']
          missing = [r for r in required if r not in tests]
          if missing:
              print(f'MISSING: {missing}')
              exit(1)
          print(f'All {len(required)} required test cases present')
          "
